name: Checks

# The fmt, clippy and test checks, shared by CI (dev/test pushes) and the release workflow.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-

      # The desktop app (reclutched-ui) needs the GTK 4 and libadwaita development files.
      - name: Install GTK libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      # The in-game overlay needs gtk4-layer-shell, which Ubuntu 24.04 does not package, so we build it.
      # (Arch has it as the package `gtk4-layer-shell`.)
      - name: Build gtk4-layer-shell
        run: |
          sudo apt-get install -y meson ninja-build libwayland-dev wayland-protocols
          curl -sSL https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.0.4.tar.gz | tar xz
          cd gtk4-layer-shell-1.0.4
          meson setup build --prefix=/usr -Dexamples=false -Ddocs=false -Dtests=false -Dvapi=false -Dintrospection=false -Dsmoke-tests=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
