name: Release

# Runs when you push a version tag such as v1.0.0 or v1.5.2. Only you create tags.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The same fmt/clippy/test checks as CI must pass before anything is published.
  check:
    uses: ./.github/workflows/checks.yml

  release:
    name: build and publish release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) and the musl target
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-musl-

      - name: Build and package
        run: .github/scripts/package.sh "${GITHUB_REF_NAME}"

      - name: Create the GitHub Release
        run: |
          flags=""
          # v1.0.0-rc1 style tags are marked as pre-releases.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then flags="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag --generate-notes --title "${GITHUB_REF_NAME}" ${flags}
