[workspace]
resolver = "2"
members = ["crates/*"]
# A plain `cargo build` builds everything except the GTK app, so it needs no GTK libraries.
# Build the app with `cargo build -p reclutched-ui`.
default-members = ["crates/reclutched-core", "crates/reclutched-daemon", "crates/reclutched-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# Smaller release binary: drop debug symbols.
[profile.release]
strip = true

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "io-std"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# "bundled" compiles SQLite into our binary, so users need no system libsqlite.
rusqlite = { version = "0.40", features = ["bundled"] }
# Renamed so code says `gtk::` and `adw::`.
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
# Draws the overlay above other windows on Wayland (needs the system library gtk4-layer-shell).
gtk4-layer-shell = "0.5"
